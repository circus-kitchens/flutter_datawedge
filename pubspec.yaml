name: flutter_datawedge
description: A Flutter package to communicate with Zebra DataWedge scanners using the DataWedge Intent API
version: 3.0.0
homepage: https://github.com/circus-kitchens/flutter_datawedge
repository: https://github.com/circus-kitchens/flutter_datawedge

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  async: ^2.13.0
  collection: ^1.19.1
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  freezed_result: ^1.0.3+1
  json_annotation: ^4.11.0
  mason_logger: ^0.3.5
  stream_transform: ^2.1.1
  strict_json: ^2.4.0

dev_dependencies:
  build_runner: ^2.13.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  lints: ^6.1.0
  pigeon: ^26.2.3
  very_good_analysis: ^10.2.0

flutter:
  plugin:
    platforms:
      android:
        package: com.circuskitchens.flutter_datawedge
        pluginClass: FlutterDatawedgePlugin
