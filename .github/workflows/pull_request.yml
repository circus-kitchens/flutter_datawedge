name: Pull Request
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  checks: write
  contents: read
env:
  FLUTTER_CHANNEL: "stable"
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Flutter Setup
        uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Dependencies
        run: flutter pub get
      - name: Dart Analyze
        uses: invertase/github-action-dart-analyzer@v1
        with:
          fatal-infos: true
          fatal-warnings: true
          annotate: true
      - name: Check Formatting
        run: dart format --set-exit-if-changed --output none $(find lib test -name "*.dart" -not \( -name "*.freezed.dart" -o -name "*.g.dart" \))

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Flutter Setup
        uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Dependencies
        run: flutter pub get
      - name: Build Android Example APK
        run: cd example && flutter build apk --release

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Flutter Setup
        uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Dependencies
        run: flutter pub get
      - name: Run Tests
        run: flutter test
